# Optional context bars. Source this file from ~/.tmux.conf.
set -g status-position bottom
set -g status-interval 0
set -g status-style 'bg=#{?@context_tabs_background,#{@context_tabs_background},#1b2330},fg=#{?@context_tabs_foreground,#{@context_tabs_foreground},#cad3f5}'
set -g status-left-length 40
set -g status-right-length 40
set -g status-left '#[bold,bg=#{?@context_tabs_accent,#{@context_tabs_accent},#8aadf4},fg=#{?@context_tabs_background,#{@context_tabs_background},#1b2330}] #{?@context_tabs_project,#{@context_tabs_project},Shell} #[default] '
set -g status-right ' #{?@context_tabs_tool,#{@context_tabs_tool},CLI} · #{?@context_tabs_state,#{@context_tabs_state},Ready}#{?@context_tabs_host, · #{@context_tabs_host},} '
set -g window-status-current-format '#[bold,fg=#{?@context_tabs_accent,#{@context_tabs_accent},#8aadf4}] #{?@context_tabs_marker,#{@context_tabs_marker} ,}#I:#{?@context_tabs_task,#{=32:@context_tabs_task},#{window_name}} #[default]'
set -g window-status-format '#[fg=#{?@context_tabs_accent,#{@context_tabs_accent},#a5adcb}] #{?@context_tabs_marker,#{@context_tabs_marker} ,}#I:#{?@context_tabs_task,#{=24:@context_tabs_task},#{window_name}} #[default]'
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-style 'fg=#49546b'
set -g pane-active-border-style 'fg=#{?@context_tabs_accent,#{@context_tabs_accent},#8aadf4}'
set -g pane-border-format ' #[bold,bg=#{?@context_tabs_accent,#{@context_tabs_accent},#8aadf4},fg=#{?@context_tabs_background,#{@context_tabs_background},#1b2330}] #{?@context_tabs_project,#{@context_tabs_project},Shell} #[default] #{?@context_tabs_task,#{@context_tabs_task},Choose a task} '
set -g set-titles on
set -g set-titles-string '#{?@context_tabs_marker,#{@context_tabs_marker} ,}#{?@context_tabs_project,#{@context_tabs_project},Shell} · #{?@context_tabs_task,#{@context_tabs_task},Choose a task}'
set -g allow-rename off
set -g automatic-rename off
